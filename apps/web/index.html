        <h1>Teranga Santé — ta santé, sans jugement</h1>
        <p>Teranga Santé est un projet gratuit pour les jeunes de 18 à 35 ans au Sénégal : s'informer sur le VIH et les IST, trouver un centre de dépistage, réserver un rendez-vous avec un code (sans donner son nom) et écrire à une infirmière.</p>
        <h2>Trois parcours</h2>
        <ul>
          <li><strong>Je m'informe</strong> : jeu Vrai ou Faux et assistant Baobi pour poser ses questions.</li>
          <li><strong>Je me fais dépister</strong> : centres de santé les plus proches, infirmières disponibles, réservation avec un code.</li>
          <li><strong>Je me soigne</strong> : rappel de traitement discret, qui reste sur le téléphone.</li>
        </ul>
        <h2>Pages</h2>
        <ul>
          <li><a href="/conseils">Conseils santé</a></li>
          <li><a href="/publications">Publications</a></li>
          <li><a href="/mentions-legales">Mentions légales</a> · <a href="/confidentialite">Politique de confidentialité</a> · <a href="/cgu">Conditions d'utilisation</a></li>
        </ul>
        <p><strong>Urgence :</strong> SAMU 1515. Après un rapport à risque de moins de 72 heures, rends-toi tout de suite dans un centre de santé.</p>
        <p>Le contenu complet des conseils est aussi disponible en texte : <a href="/llms-full.txt">/llms-full.txt</a>. Le site nécessite JavaScript pour fonctionner.</p>
